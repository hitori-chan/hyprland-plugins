# One plugin, one load: there is no inter-plugin order to encode.
# No commit_pins: one Hyprland (the hitori-chan/Hyprland fork), so hyprpm
# builds the default branch.

[repository]
name    = "hyprland-plugins"
authors = ["hitori"]

[awesome]
description = "the awesome shell as one native plugin: bar, windows, notifications, system"
version     = "2.3.0"
authors     = ["hitori"]
output      = "awesome/awesome.so"
build       = ["make -C awesome all"]
