# Two independent plugins, each its own load: awesome (the shell) and
# vclick (clicks without the user's pointer). Neither depends on the
# other: there is no inter-plugin order to encode.
# No commit_pins: one Hyprland (the hitori-chan/Hyprland fork), so hyprpm
# builds the default branch.

[repository]
name    = "hyprland-plugins"
authors = ["hitori"]

[awesome]
description = "the awesome shell as one native plugin: bar, windows, notifications, system"
version     = "4.3.0"
authors     = ["hitori"]
output      = "awesome/awesome.so"
build       = ["make -C awesome all"]

[vclick]
description = "click, scroll or move inside a window without the user's pointer"
version     = "2.3.0"
authors     = ["hitori"]
output      = "vclick/vclick.so"
build       = ["make -C vclick all"]
